<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Analyst Chat</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #f5f7fb; }
      .container { max-width: 960px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
      .header { padding: 14px 18px; background: #0a7cff; color: white; font-weight: 600; }
      .chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
      .bubble { max-width: 72%; padding: 12px 14px; border-radius: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
      .user { align-self: flex-end; background: #daf0ff; }
      .bot { align-self: flex-start; background: white; }
      .input { display: flex; gap: 10px; padding: 12px; border-top: 1px solid #e5e9f2; background: white; }
      .input input { flex: 1; padding: 12px 14px; border: 1px solid #d6dbe5; border-radius: 10px; font-size: 15px; }
      .input button { background: #0a7cff; color: white; border: 0; padding: 0 16px; border-radius: 10px; font-weight: 600; }
      .result-item { margin: 8px 0; }
      .images { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
      .images img { width: 100%; height: 140px; object-fit: contain; background: #fafafa; border: 1px solid #eee; border-radius: 8px; }
      .meta { color: #5a6b8c; font-size: 12px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">AI PDF Analyst</div>
      <div id="chat" class="chat"></div>
      <div class="input">
        <input id="q" placeholder="Ask something relevant to the documents..." />
        <button id="send">Send</button>
      </div>
    </div>

    <script>
      const chat = document.getElementById('chat');
      const input = document.getElementById('q');
      const send = document.getElementById('send');

      function addBubble(text, who='bot') {
        const div = document.createElement('div');
        div.className = 'bubble ' + (who === 'user' ? 'user' : 'bot');
        div.innerHTML = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      function renderResults(results) {
        const container = document.createElement('div');
        container.className = 'bubble bot';
        if (!results || !results.length) {
          container.textContent = 'No relevant content found.';
          chat.appendChild(container);
          return;
        }
        results.forEach(r => {
          const item = document.createElement('div');
          item.className = 'result-item';
          if (r.kind === 'text') {
            const p = document.createElement('div');
            p.textContent = r.text;
            item.appendChild(p);
            if (r.images && r.images.length) {
              const grid = document.createElement('div');
              grid.className = 'images';
              r.images.forEach(img => {
                const i = document.createElement('img');
                i.src = img.url;
                i.loading = 'lazy';
                grid.appendChild(i);
              });
              item.appendChild(grid);
            }
          } else if (r.kind === 'image') {
            const grid = document.createElement('div');
            grid.className = 'images';
            const i = document.createElement('img');
            i.src = r.image.url;
            i.loading = 'lazy';
            grid.appendChild(i);
            item.appendChild(grid);
            if (r.caption) {
              const p = document.createElement('div');
              p.textContent = r.caption;
              item.appendChild(p);
            }
          }
          container.appendChild(item);
        });
        chat.appendChild(container);
        chat.scrollTop = chat.scrollHeight;
      }

      async function sendQuery() {
        const q = input.value.trim();
        if (!q) return;
        addBubble(q, 'user');
        input.value = '';
        const thinking = addBubble('Thinking...');
        try {
          const res = await fetch('/query', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: q })
          });
          const data = await res.json();
          thinking.remove();
          renderResults(data.results || []);
        } catch (e) {
          thinking.textContent = 'Error fetching results.';
        }
      }

      send.addEventListener('click', sendQuery);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendQuery(); });
    </script>
  </body>
  </html>
